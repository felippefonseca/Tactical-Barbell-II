<div id="app"><div class="boot">Carregando programa...</div></div>

<style>
:root{
  --paper:#DCD9CF; --paper2:#D0CDC2; --paper3:#C4C1B5;
  --ink:#22261F; --ink2:#5C6153; --ink3:#83877A; --line:#A9A69A;
  --e:#1F5A63; --se:#6B6A2E; --forca:#3E4C6B; --hic:#A63D1F; --rec:#8A887D; --brass:#B8892B;
  --mono: ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
#app{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;border:1px solid var(--line)}
.boot{font-family:var(--mono);padding:40px;text-align:center;color:var(--ink2);font-size:13px}
#app h1,#app h2,#app h3,#app .lbl{font-family:var(--mono);font-weight:600;margin:0}

.hdr{border-bottom:2px solid var(--ink);padding:18px 20px 14px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.hdr-t h1{font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.hdr-t p{margin:4px 0 0;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase}
.stamp{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1.5px solid var(--ink2);color:var(--ink2);padding:4px 9px;transform:rotate(-1.5deg)}

.bar{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar.col{display:block}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}

button{font-family:var(--mono);cursor:pointer;border:1px solid var(--line);background:var(--paper2);color:var(--ink);padding:7px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;transition:background .12s,border-color .12s}
button:hover{background:var(--paper3);border-color:var(--ink2)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.ghost{background:transparent}
button.nav{padding:7px 14px;font-size:14px;line-height:1}
select{font-family:var(--mono);font-size:12px;padding:7px 9px;border:1px solid var(--line);background:var(--paper2);color:var(--ink)}
input[type=text]{font-family:var(--mono);font-size:12px;padding:6px 8px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);width:100%}
.grp{display:flex;flex-wrap:wrap}
.grp button{border-right-width:0}
.grp button:last-child{border-right-width:1px}

.wkbar{justify-content:space-between}
.wkid{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wkid h2{font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.wkid .sub{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink2);text-transform:uppercase}
.tag-easy{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--brass);color:#fff;padding:3px 8px}

.band-wrap{padding:16px 20px 18px;border-bottom:1px solid var(--line)}
.band-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:12px;flex-wrap:wrap}
.band{display:flex;height:34px;border:1px solid var(--ink);background:var(--paper2)}
.band .seg{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:#fff;border-right:1px solid rgba(0,0,0,.25);overflow:hidden;min-width:0}
.band .seg:last-child{border-right:0}
.axis{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase}
.band-note{font-family:var(--mono);font-size:10px;color:var(--ink2)}

.days{padding:0}
.day{display:grid;grid-template-columns:6px 46px 1fr 150px 34px;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day.done{background:rgba(255,255,255,.3)}
.dnum{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--ink2);border-right:1px solid var(--line)}
.dbody{padding:12px 14px;min-width:0}
.dtitle{font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;font-weight:600}
.day.done .dtitle{text-decoration:line-through;color:var(--ink2)}
.dpres{font-size:13px;color:var(--ink2);margin-top:3px}
.dhow{font-size:12.5px;color:var(--ink);margin-top:6px;padding:7px 9px;background:rgba(255,255,255,.4);border-left:2px solid var(--line);white-space:pre-line}
.dpick{padding:12px 10px;border-left:1px solid var(--line);display:flex;align-items:center}
.dpick select{width:100%;font-size:10.5px;padding:5px 6px}
.dpick .none{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.08em}
.dcheck{border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.dcheck button{border:0;background:transparent;width:100%;height:100%;font-size:15px;padding:0;color:var(--ink3)}
.dcheck button.yes{color:var(--ink)}
.dcheck button:hover{background:var(--paper2)}

.cols{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.col-p{padding:16px 20px}
.col-p + .col-p{border-left:1px solid var(--line)}
.col-p h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.rules{list-style:none;margin:0;padding:0}
.rules li{font-size:13px;padding:5px 0 5px 16px;position:relative}
.rules li::before{content:"";position:absolute;left:0;top:12px;width:7px;height:1.5px;background:var(--ink3)}
.quote{font-size:13px;font-style:italic;color:var(--ink2);border-left:2px solid var(--line);padding-left:12px;margin:12px 0 0}

.bench{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bench label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}

.panel{border-bottom:1px solid var(--line)}
.phead{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px}
.phead h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.pbody{padding:0 20px 20px}
.filters{margin-bottom:14px}
.sess{border-top:1px solid var(--line);padding:11px 0 11px 12px;position:relative}
.sname{font-family:var(--mono);font-size:12px;letter-spacing:.04em;font-weight:600}
.sname .n{color:var(--ink3);margin-right:7px}
.sdet{font-size:13px;color:var(--ink2);margin-top:3px;white-space:pre-line}
.stags{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:6px;white-space:pre-line;line-height:1.7}

.gl{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:190px 1fr;gap:14px}
.gl b{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em}
.gl span{font-size:13px;color:var(--ink2)}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);font-weight:600}
.tbl td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-family:var(--mono);font-size:11.5px;white-space:nowrap}

.ftr{padding:14px 20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.ftr p{margin:0;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:14px}
.lg{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.lg i{width:11px;height:11px;display:block}

.setup{padding:26px 20px}
.setup h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.setup p.intro{font-size:13.5px;color:var(--ink2);margin:0 0 22px;max-width:64ch}
.q{margin-bottom:20px}
.q h3{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.q .hint{font-size:13px;color:var(--ink2);margin:0 0 9px;max-width:72ch}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--paper2);padding:10px 13px;cursor:pointer;text-align:left;max-width:300px;text-transform:none;letter-spacing:0;font-size:13px}
.opt b{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.opt span{display:block;font-family:var(--sans);font-size:12.5px;color:var(--ink2);line-height:1.42}
.opt.on{background:var(--ink);border-color:var(--ink)}
.opt.on b,.opt.on span{color:var(--paper)}

@media(max-width:760px){
  .day{grid-template-columns:6px 34px 1fr 34px;grid-template-areas:"s n b c" ". . p p"}
  .day > div:nth-child(1){grid-area:s}
  .dnum{grid-area:n}.dbody{grid-area:b;padding:11px 12px}.dcheck{grid-area:c}
  .dpick{grid-area:p;border-left:0;border-top:1px solid var(--line);padding:8px 12px 10px}
  .cols{grid-template-columns:1fr}
  .col-p + .col-p{border-left:0;border-top:1px solid var(--line)}
  .bench{grid-template-columns:1fr 1fr}
  .gl{grid-template-columns:1fr;gap:2px}
  .hdr{padding:15px 16px 12px}
  .bar,.band-wrap,.col-p,.phead,.ftr,.setup{padding-left:16px;padding-right:16px}
  .pbody{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
"use strict";
var KEY="tb2:pt:v2";

var DOM={
  E:{nome:"Aeróbio longo",cor:"var(--e)",curto:"AERÓBIO"},
  SE:{nome:"Força-resistência",cor:"var(--se)",curto:"F-RESIST"},
  FORCA:{nome:"Musculação de força",cor:"var(--forca)",curto:"FORÇA"},
  HIC:{nome:"Condicionamento intenso",cor:"var(--hic)",curto:"INTENSO"},
  REC:{nome:"Recuperação",cor:"var(--rec)",curto:"RECUP"},
  DESC:{nome:"Descanso",cor:"transparent",curto:""}
};

/* ============ GLOSSÁRIO ============ */
var GLOSSARIO=[
 ["Aeróbio longo (E no livro)","Sessão contínua e leve, mínimo de 30 min, ideal 45 a 60. Ritmo em que você consegue conversar. É o que aumenta o volume do coração."],
 ["Condicionamento intenso (HIC no livro)","Sessão curta e forte, geralmente 15 a 30 min. Tiros, circuitos, sprints. Trabalha o sistema anaeróbio e a capacidade de trabalho."],
 ["Força-resistência (SE no livro)","Circuito de 5 a 8 exercícios com carga leve (15 a 30% da sua carga máxima) e reps altas, 20 a 50. Descanso curto. Não é treino de força."],
 ["Ritmo constante (LSS no livro)","Correr, pedalar ou remar em velocidade única, sem acelerar nem parar, por tempo determinado."],
 ["Bloco I / Construção de base","As 8 primeiras semanas. Obrigatórias para todo mundo, qualquer que seja o objetivo."],
 ["Protocolo Preto (Black)","Continuação padrão. Prioriza condicionamento intenso e força. Aeróbio só em manutenção."],
 ["Protocolo Verde (Green)","Continuação para quem prioriza resistência. Muito aeróbio, força em dois dias fixos."],
 ["Semana fácil","Toda terceira semana do Protocolo Preto: corte metade dos rounds, do tempo ou da intensidade do condicionamento."],
 ["Carga máxima (1RM)","O peso que você consegue levantar uma única vez. Não precisa testar de verdade, estime."],
 ["Carga de trabalho","90% da sua carga máxima estimada. Use ela como base para calcular todos os percentuais do bloco."],
 ["Swing","Balanço com halter entre as pernas até a altura do peito, empurrando com o quadril. Substitui o kettlebell do livro."],
 ["Burpee","Do pé, desce para prancha, flexão, volta e salta."],
 ["Ritmo de conversa","Você consegue falar uma frase inteira sem ofegar. Se não consegue, está rápido demais."]
];

/* ============ SESSÕES ============ */
/* aca = pode ser feito só com academia */
var SESSOES_E=[
 {n:1,nome:"Ritmo constante",aca:true,
  det:"60 min contínuos, sem parar, em ritmo de conversa.",
  aca_txt:"Esteira, bike, elíptico, transport ou remo. Escolha um e fique nele.\nEsteira: inclinação 1%, velocidade em que você conseguiria conversar.\nFrequência cardíaca entre 120 e 150 bpm, ou 50 a 70% da máxima.\nSe estiver na dúvida se está rápido demais, diminua.",
  b:"30 min, pode alternar caminhada e corrida",a:"90 a 120 min"},

 {n:2,nome:"Caminhada com carga",aca:true,
  det:"90 min de caminhada inclinada com mochila carregada.",
  aca_txt:"Esteira com inclinação de 8 a 12%, velocidade 5 a 5,5 km/h.\nMochila com 10 a 20 kg. Envolva anilhas ou halteres em toalha para não bater na lombar.\nMantenha 120 a 150 bpm. Sem correr.",
  b:"9 a 11 kg e/ou 30 a 60 min",a:"2 a 4 h e/ou 30 kg +"},

 {n:3,nome:"Rodízio de três",aca:true,
  det:"Corda 10 min, esteira 10 min, remo 10 min. Duas voltas.",
  aca_txt:"Sem descanso entre os aparelhos nem entre as voltas.\nTudo leve, ritmo de conversa. É uma alternativa ao ritmo constante quando você enjoa de ficar 60 min no mesmo aparelho.\nPode trocar por: bike, elíptico, transport, escada.",
  b:"1 volta",a:"3 a 4 voltas"},

 {n:4,nome:"Corrida com paradas",aca:true,
  det:"45 a 60 min leves com paradas para calistenia a cada 6 min.",
  aca_txt:"Esteira em ritmo leve. Alarme a cada 6 min. Alterne:\nParada A: 10 burpees\nParada B: 20 agachamentos livres + 20 flexões\nVolta para a esteira sem descansar. Repita até fechar o tempo.",
  b:"30 min, 5 burpees e 10+10",a:"60 min, com colete de 5 a 7 kg"},

 {n:5,nome:"Corrida com halter",aca:true,
  det:"45 min leves com paradas para halter a cada 7 min.",
  aca_txt:"Esteira leve com um halter de 10 a 20 kg no chão ao lado.\nParada A: 10 swings\nParada B: 10 agachamentos segurando o halter no peito\nParada C: 10 flexões\nCicle A, B, C. Sem descanso nas trocas.",
  b:"25 a 30 min",a:"60 min e/ou 20 reps por parada"},

 {n:6,nome:"Corrida forte com paradas",aca:true,
  det:"Versão dura da corrida com paradas, feita para tempo.",
  aca_txt:"Meta: completar 8 a 10 km na esteira no menor tempo possível.\nAlarme a cada 7 min, ciclando:\nA: 25 flexões + 25 agachamentos\nB: 50 escaladores (25 por perna)\nC: 10 burpees + 25 abdominais\nRitmo desconfortável, não é ritmo de conversa. Use no máximo uma vez por semana.",
  b:"3 a 5 km, reps pela metade",a:"13 a 16 km"},

 {n:7,nome:"Teste dos 45 minutos",aca:true,
  det:"Percorra a maior distância possível em 45 min. Anote.",
  aca_txt:"Esteira, com a inclinação em 1%. Anote a distância.\nRepita a cada dois meses para medir progresso. Não é sessão semanal.",
  b:"30 min",a:"60 min"},

 {n:8,nome:"Circuito de força-resistência",aca:true,
  det:"5 a 8 exercícios, carga leve, reps altas, descanso curto.",
  aca_txt:"Monte um circuito que cubra o corpo todo. Exemplo pronto para academia:\n1. Flexão\n2. Agachamento livre ou goblet\n3. Remada curvada com barra leve\n4. Extensão lombar\n5. Paralela ou mergulho no banco\n6. Elevação de pernas suspenso\nCarga: 15 a 30% da sua carga máxima. Não precisa calcular, estime e erre para baixo.\nDescanso: 30 a 120 s entre exercícios, 2 min entre voltas. Quanto menor, melhor.\nSe não fechar as reps de uma vez, pause alguns segundos e termine. Isso é esperado.\nEscolha exercícios que você não vá esperar aparelho para usar.",
  b:"Menos voltas e menos reps",a:"Colete de peso"}
];

var SESSOES_HIC=[
 {n:1,nome:"Escada 10 a 1",cat:"AA",base:true,aca:true,
  det:"10 burpees + 100 m de corrida, 9 burpees + 100 m, e assim por diante até 1.",
  aca_txt:"Na esteira: deixe programada uma velocidade forte. Faça os burpees ao lado, suba, corra 100 m, desça, faça os próximos.\nSe a troca na esteira for chata, troque a corrida por 250 m de remo.\nMeta: terminar o mais rápido possível.",
  b:"Comece em 5 a 1 e/ou 50 m",a:"Some 10 agachamentos em cada parada"},

 {n:2,nome:"Corrida em ritmo forte",cat:"AA",base:true,aca:true,
  det:"5 km a 80 a 85% da frequência máxima.",
  aca_txt:"Esteira, 5 km. Mais rápido que a sessão de ritmo constante: você não consegue conversar com facilidade, mas sustenta até o fim.\nSem paradas.",
  b:"2,5 km",a:"Aumente a distância"},

 {n:3,nome:"Tiros de 600 m com descanso longo",cat:"AA",base:true,aca:true,
  det:"600 m em esforço máximo, 3 a 5 min de descanso, 6 vezes.",
  aca_txt:"Esteira ou remo. Aqueça 5 a 10 min antes em ritmo leve.\nCada tiro é esforço máximo. Depois desça e descanse os 3 a 5 min inteiros.\nO descanso longo é o objetivo da sessão, não preguiça: o estímulo vem de explodir descansado. Cortar o descanso destrói o efeito.\nEssa é a sessão que aumenta a força de contração do coração.",
  b:"4 tiros",a:"10 tiros"},

 {n:4,nome:"Tiros de 2 minutos",cat:"AA",base:true,aca:true,
  det:"2 min em esforço quase máximo, 3 a 5 min de descanso, 5 vezes.",
  aca_txt:"Esteira, bike, remo ou escada. Versão indoor dos tiros de 600 m e provavelmente a mais prática para você.\nOs 2 min ficam em torno de 80 a 90% da frequência máxima. Não é sprint total, é o mais forte que você sustenta por 2 min.\nNa esteira: se o aparelho vai até velocidade 12, algo entre 9 e 11. Ajuste com inclinação se precisar.\nDescanse os 3 a 5 min inteiros caminhando.",
  b:"Comece com 1 min e evolua",a:"Até 10 repetições"},

 {n:5,nome:"Marreta adaptada",cat:"AA",base:true,aca:true,
  det:"Blocos alternados de empurrar peso e corda, 5 rounds.",
  aca_txt:"No lugar da marreta no pneu, use desenvolvimento em pé com halteres ou barra leve.\n1 min de desenvolvimento + 1 min de corda\n30 s de desenvolvimento + 30 s de corda\nDescanso de 2 a 3 min. Repita 5 vezes.\nEsforço potente e constante, não all-out. Isso treina o limiar anaeróbio.",
  b:"3 rounds",a:"1 min em cada movimento"},

 {n:6,nome:"Halter e corrida",cat:"AA",base:true,aca:true,

  aca_txt:"Halter de 16 a 32 kg. Faça 60 s de swings em ritmo constante (troque a mão no meio se for unilateral).\nSolte o halter e vá direto para 800 m na esteira o mais rápido que aguentar.\nVolte, descanse 2 a 3 min e repita. Aqui você não precisa estar totalmente recuperado.",

 {n:7,nome:"Burpee e corrida",cat:"AA",base:true,aca:true,
  det:"10 burpees, 800 m, 5 burpees, 400 m máximo. 3 rounds.",
  aca_txt:"Os 800 m não são sprint, são mais rápidos que trote. Os 400 m finais são esforço máximo.\nDescanso de 2 a 3 min entre rounds. Cada round o mais rápido possível.",

 {n:8,nome:"Intervalado com halter",cat:"AA",base:true,aca:true,
  det:"Alterna corrida leve com halter por 20 min corridos.",
  aca_txt:"Esteira num ritmo um pouco mais lento que trote confortável. Deixe ela ligada durante as pausas.\n2 min de esteira, desce, 20 swings\n2 min de esteira, desce, 10 arranques ou desenvolvimentos por braço\nRepita até a esteira marcar 20 min.",
  b:"10 swings, 5 por braço, 15 min",a:"Halteres mais pesados, 30 min"},

 {n:9,nome:"Tiros curtos em subida",cat:"AA",base:true,aca:true,
  det:"Sprint curto em subida, 10 vezes, com 30 a 60 s de descanso.",
  aca_txt:"Sem morro, use a esteira com inclinação de 10 a 15%.\nSuba com a esteira parada, ligue na velocidade de sprint, corra 12 a 15 s, saia para as bordas e descanse 30 a 60 s.\nAlternativa: escada da academia, ou bike com carga alta em pé.\nO autor diz que se pudesse escolher um único exercício de condicionamento para a vida, seria tiro em subida.",

 {n:10,nome:"Tiros longos em subida",cat:"AA",base:true,aca:true,

 {n:11,nome:"Dívida de oxigênio",cat:"AA",aca:true,

 {n:12,nome:"Escada de velocidade",cat:"AA",aca:true,
  det:"400, 300, 200, 100 m e volta subindo. Tudo máximo.",
  aca_txt:"Melhor no remo, que permite trocar distância rápido.\nDescansos: 40 s, 30 s, 20 s, 10 s, respectivamente.\nDepois do 100 m, suba a escada de novo: 100, 200, 300, 400.",

function preto(tpl,profissional,ciclos){
  var base=PRETO[tpl]||PRETO.d3,out=[];
  for(var c=0;c<ciclos;c++){
    for(var w=0;w<3;w++){
      var dias=JSON.parse(JSON.stringify(base[w]));
      if(profissional&&w<2){
        var temE=dias.some(function(x){return x.t==="E";});
        if(!temE){
          for(var i=dias.length-1;i>=0;i--){ if(dias[i].t==="HIC"){dias[i]=d("E","Mínimo 60 min");break;} }
        }else{ dias.forEach(function(x){if(x.t==="E")x.p="Mínimo 60 min";}); }
      }
      out.push({sem:out.length+1,fase:"Preto",facil:(w===2),dias:dias});
    }
  }
  return out;
}

function verde(){
  var out=[],i;
  for(i=1;i<=6;i++){
    out.push({sem:i,fase:"Verde",facil:false,dias:[
      d("FORCA",TXT_FORCA_2),d("E","60 a 120 min"),d("E","60 min, ou recuperação"),
      d("FORCA",TXT_FORCA_2),d("E","60 a 120 min"),
      (i>=5)?d("HIC","Subida, velocidade ou circuito geral"):d("E","60 a 120 min"),
      d("DESC")]});
  }
  var p=[[30,35,40],[40,45,50],[50,55,60]];
  for(i=0;i<3;i++){
    out.push({sem:7+i,fase:"Verde",facil:false,dias:[
      d("SE","3 voltas × "+p[i][0]+" reps"),d("E","60 a 120 min"),
      d("SE","3 voltas × "+p[i][1]+" reps"),d("E","60 a 120 min"),
      d("SE","2 voltas × "+p[i][2]+" reps"),d("HIC","Subida, velocidade ou circuito geral"),d("DESC")]});
  }
  return out;
}

function verdeSE(ciclos){
  var p=[[30,30,35],[40,40,45],[50,50,50]],out=[];
  for(var c=0;c<ciclos;c++){
    for(var i=0;i<3;i++){
      out.push({sem:out.length+1,fase:"Verde F-R",facil:false,dias:[
        d("SE","3 voltas × "+p[i][0]+" reps"),d("E","45 a 90 min"),
        d("SE","3 voltas × "+p[i][1]+" reps"),d("E","45 a 90 min"),
        d("SE","2 voltas × "+p[i][2]+" reps"),d("E","45 a 90 min, ou 1 sessão intensa"),d("DESC")]});
    }
  }
  return out;
}

function tela(){
  var cal=calendario();
  if(S.semana>=cal.length)S.semana=cal.length-1;
  if(S.semana<0)S.semana=0;
  var w=cal[S.semana];
  var regra=REGRAS[w.fase]||REGRAS["Preto"];
  var faseTxt=w.fase==="Bloco I"?("Construção de base, semana "+w.sem+" de 8"):("Protocolo "+w.fase+", semana "+w.sem);

  return ''+
  '<div class="hdr"><div class="hdr-t"><h1>Programa de condicionamento</h1><p>'+esc(faseTxt)+'</p></div>'+
  '<div class="stamp">'+esc(rotulo())+'</div></div>'+

  '<div class="bar wkbar">'+
    '<div class="wkid">'+
      '<div class="grp"><button class="nav" id="prev" aria-label="Semana anterior">&#8249;</button><button class="nav" id="next" aria-label="Próxima semana">&#8250;</button></div>'+
      '<div><h2>Semana '+(S.semana+1)+'</h2><div class="sub">'+esc(w.fase)+', semana '+w.sem+'</div></div>'+
      (w.facil?'<span class="tag-easy">Semana fácil</span>':'')+
    '</div>'+
    '<div class="grp"><button id="inicio" class="ghost">Voltar ao início</button><button id="reset" class="ghost">Reconfigurar</button></div>'+
  '</div>'+

  banda(w)+dias(w)+

  '<div class="cols">'+
    '<div class="col-p"><h3>'+esc(regra.titulo)+'</h3><ul class="rules">'+regra.itens.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul><p class="quote">'+esc(regra.frase)+'</p></div>'+
    '<div class="col-p"><h3>Princípios que valem sempre</h3><ul class="rules">'+PRINCIPIOS.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'+
  '</div>'+

  painelForca()+
  painelGlossario()+
  biblioteca()+

  '<div class="bar col">'+
    '<div class="lbl" style="margin-bottom:10px">Marcadores, compare só a cada 6 meses</div>'+
    '<div class="bench">'+marca("fc","Batimentos em repouso","bpm")+marca("t24","2,4 km","mm:ss")+marca("t5k","5 km","mm:ss")+marca("t10k","10 km","mm:ss")+'</div>'+
  '</div>'+

  '<div class="ftr"><div class="legend">'+["E","SE","FORCA","HIC","REC"].map(function(k){
    return '<span class="lg"><i style="background:'+cor(k)+'"></i>'+esc(DOM[k].nome)+'</span>';}).join('')+
  '</div><p>Progresso salvo automaticamente</p></div>';
}

function rotulo(){
  var a=S.bloco1==="padrao"?"Circuito primeiro":"Musculação primeiro";
  var b=S.protocolo==="preto"?("Preto"+(S.profissional?" pro":"")):(S.protocolo==="verde"?"Verde":"Verde F-R");
  var c=S.protocolo==="preto"?({d2:"2 dias",d3:"3 dias",d4:"4 dias"}[S.forca]):"2 dias";
  return a+" / "+b+" / "+c;
}
function marca(k,r,ph){return '<div><label for="m_'+k+'">'+esc(r)+'</label><input type="text" id="m_'+k+'" data-marca="'+k+'" value="'+esc(S.marcas[k]||"")+'" placeholder="'+esc(ph)+'"></div>';}

function banda(w){
  var segs=w.dias.filter(function(x){return x.t!=="DESC";});
  var total=segs.reduce(function(a,x){return a+peso(x.t);},0)||1;
  var html=segs.map(function(x){
    var pc=peso(x.t)/total*100;
    return '<div class="seg" style="flex:0 0 '+pc.toFixed(2)+'%;background:'+cor(x.t)+'" title="'+esc(DOM[x.t].nome)+'">'+(pc>11?esc(DOM[x.t].curto):"")+'</div>';
  }).join('');
  var c=function(t){return w.dias.filter(function(x){return x.t===t;}).length;};
  var nota=c("E")+" aeróbio · "+c("HIC")+" intenso · "+c("FORCA")+" musculação · "+c("SE")+" circuito";
  return '<div class="band-wrap"><div class="band-head"><span class="lbl">Como a semana se divide</span><span class="band-note">'+esc(nota)+'</span></div>'+
    '<div class="band">'+html+'</div><div class="axis"><span>Longo e leve</span><span>Curto e forte</span></div></div>';
}

function dias(w){
  return '<div class="days">'+w.dias.map(function(x,i){
    var id=S.semana+":"+i, feito=!!S.feitos[id];
    var pres=x.p||(x.t==="REC"?"Mobilidade, caminhada, natação leve, alongamento ou nada":"");
    if(x.t==="DESC")pres="Sem treino estruturado";

    var como="";
    var esc_sel=S.escolhas[id];
    if(esc_sel){
      var lista=(x.t==="E")?SESSOES_E:(x.t==="HIC"?SESSOES_HIC:null);
      var s=lista?achar(lista,esc_sel):null;
      if(s) como=s.aca_txt||s.det;
    }else if(x.t==="SE"){
      como="Escolha 5 a 8 exercícios que cubram o corpo todo, carga leve, e faça as voltas e reps indicadas acima. O circuito pronto está na biblioteca, em Força-resistência.";
    }else if(x.t==="FORCA"){
      como="Consulte o painel Como montar a musculação, logo abaixo do calendário.";
    }

    return '<div class="day'+(feito?' done':'')+'">'+
      '<div style="background:'+cor(x.t)+'"></div>'+
      '<div class="dnum">D'+(i+1)+'</div>'+
      '<div class="dbody"><div class="dtitle">'+esc(DOM[x.t].nome)+'</div><div class="dpres">'+esc(pres)+'</div>'+
        (como?'<div class="dhow">'+esc(como)+'</div>':'')+
      '</div>'+
      '<div class="dpick">'+seletor(x,id)+'</div>'+
      '<div class="dcheck"><button data-feito="'+id+'" class="'+(feito?'yes':'')+'" aria-label="Marcar como feito">'+(feito?"&#10003;":"&#9744;")+'</button></div>'+
    '</div>';
  }).join('')+'</div>';
}

function seletor(x,id){
  var lista=null,rot="";
  if(x.t==="E"){lista=SESSOES_E;rot="Escolher sessão";}
  else if(x.t==="HIC"){rot="Escolher sessão";
    lista=SESSOES_HIC.filter(function(s){return (x.p&&x.p.indexOf("1 a 10")>=0)?s.base:true;});}
  if(!lista) return '<span class="none">'+(x.t==="SE"?"Circuito":(x.t==="FORCA"?"Barra":"&mdash;"))+'</span>';
  var v=S.escolhas[id]||"";
  return '<select data-escolha="'+id+'" aria-label="'+esc(rot)+'"><option value="">'+esc(rot)+'</option>'+
    lista.map(function(s){return '<option value="'+s.n+'"'+(String(s.n)===String(v)?' selected':'')+'>'+esc(s.nome)+'</option>';}).join('')+'</select>';
}

/* ============ PAINÉIS ============ */
function painelForca(){
  var aberto=S.aberto.forca;
  return '<div class="panel"><div class="phead" data-abre="forca"><h3>Como montar a musculação</h3><button class="ghost">'+(aberto?"Fechar":"Abrir")+'</button></div>'+
  (aberto?'<div class="pbody">'+
    '<p style="font-size:13.5px;color:var(--ink2);margin:0 0 14px;max-width:74ch">A musculação aqui não é a que você está acostumado. Não existe divisão por grupo muscular, não existe treino até a falha e o volume de isolados é próximo de zero. Você escolhe de 2 a 4 exercícios compostos e repete os mesmos a semana toda, sempre parando antes da fadiga. É prática, não é sofrimento.</p>'+
    '<table class="tbl"><thead><tr><th>Semana</th><th>Séries × reps</th><th>Carga</th><th>Como deve sentir</th></tr></thead><tbody>'+
    '<tr><td>1 e 4</td><td>4 a 10 × 5</td><td>70%</td><td>Leve. Volume alto, carga baixa. Prepara o corpo</td></tr>'+
    '<tr><td>2 e 5</td><td>3 a 5 × 3 a 5</td><td>80 a 85%</td><td>Trabalho de verdade. Exige atenção</td></tr>'+
    '<tr><td>3 e 6</td><td>3 a 4 × 2 a 3</td><td>90 a 95%</td><td>Pesado. É a semana que coincide com a semana fácil do condicionamento</td></tr>'+
    '</tbody></table>'+
    '<p style="font-size:13.5px;margin:16px 0 8px"><b>Como calcular a carga:</b> estime quanto você levanta uma única vez em cada exercício, tire 10% disso e use esse número como base para todos os percentuais. Não precisa testar de verdade. Erre para baixo.</p>'+
    '<p style="font-size:13.5px;margin:0 0 8px"><b>Exemplos de cluster de exercícios:</b></p>'+
    '<ul class="rules">'+
      '<li>Agachamento e supino nos dias A, terra e desenvolvimento nos dias B</li>'+
      '<li>Versão minimalista, os mesmos três em todas as sessões: agachamento frontal, desenvolvimento militar e barra fixa com carga</li>'+
      '<li>Versão de dois exercícios: agachamento e supino, mais 50 a 100 swings com halter ao fim de duas sessões por semana para cobrir a cadeia posterior</li>'+
    '</ul>'+
    '<p class="quote" style="margin-top:16px">Nunca treine no limite. Levantar com frequência e sempre um pouco abaixo do máximo é o que faz esse sistema funcionar junto com o condicionamento.</p>'+
  '</div>':'')+'</div>';
}

function painelGlossario(){
  var aberto=S.aberto.glossario;
  return '<div class="panel"><div class="phead" data-abre="glossario"><h3>Glossário</h3><button class="ghost">'+(aberto?"Fechar":"Abrir")+'</button></div>'+
  (aberto?'<div class="pbody">'+GLOSSARIO.map(function(g){
    return '<div class="gl"><b>'+esc(g[0])+'</b><span>'+esc(g[1])+'</span></div>';
  }).join('')+'</div>':'')+'</div>';
}

function biblioteca(){
  var aberto=S.aberto.lib,f=S.libFiltro,lista,tipo;
  if(f==="E"){lista=SESSOES_E;tipo="E";}
  else if(f==="CORE"){lista=SESSOES_CORE;tipo="C";}
  else{lista=SESSOES_HIC.filter(function(s){return s.cat===f;});tipo="H";}
  var filtros=[["E","Aeróbio e circuitos"],["AA","Intenso: tiros e subidas"],["GC","Intenso: circuito geral"],["POT","Intenso: potência"],["CORE","Core e pegada"]];

  return '<div class="panel"><div class="phead" data-abre="lib"><h3>Biblioteca de sessões</h3><button class="ghost">'+(aberto?"Fechar":"Abrir")+'</button></div>'+
  (aberto?'<div class="pbody">'+
    '<div class="filters grp">'+filtros.map(function(x){return '<button data-filtro="'+x[0]+'" class="'+(f===x[0]?"on":"")+'">'+esc(x[1])+'</button>';}).join('')+'</div>'+
    lista.map(function(s){
      var c=tipo==="E"?"var(--e)":(tipo==="C"?"var(--se)":"var(--hic)");
      var t=[];
      if(s.b)t.push("Versão mais fácil: "+s.b);
      if(s.a)t.push("Versão mais difícil: "+s.a);
      return '<div class="sess"><div style="position:absolute;left:0;top:11px;bottom:11px;width:3px;background:'+c+'"></div>'+
        '<div class="sname"><span class="n">'+s.n+'</span>'+esc(s.nome)+'</div>'+
        '<div class="sdet">'+esc(s.det)+'</div>'+
        (s.aca_txt?'<div class="dhow" style="margin-top:7px">'+esc(s.aca_txt)+'</div>':'')+
        (t.length?'<div class="stags">'+esc(t.join("\n"))+'</div>':'')+
      '</div>';
    }).join('')+
  '</div>':'')+'</div>';
}

/* ============ EVENTOS ============ */
function ligar(){
  var q=function(s){return root.querySelector(s);};
  var qa=function(s){return Array.prototype.slice.call(root.querySelectorAll(s));};

  qa("[data-set]").forEach(function(b){b.addEventListener("click",function(){S[b.dataset.set]=b.dataset.val;render();});});
  qa("[data-bool]").forEach(function(b){b.addEventListener("click",function(){S[b.dataset.bool]=(b.dataset.val==="1");render();});});
  if(q("#go"))q("#go").addEventListener("click",function(){S.configurado=true;S.semana=0;salvar();render();});
  if(q("#prev"))q("#prev").addEventListener("click",function(){if(S.semana>0){S.semana--;salvar();render();}});
  if(q("#next"))q("#next").addEventListener("click",function(){if(S.semana<calendario().length-1){S.semana++;salvar();render();}});
  if(q("#inicio"))q("#inicio").addEventListener("click",function(){S.semana=0;salvar();render();});
  if(q("#reset"))q("#reset").addEventListener("click",function(){S.configurado=false;S.feitos={};S.escolhas={};S.semana=0;salvar();render();});

  qa("[data-feito]").forEach(function(b){b.addEventListener("click",function(){
    var k=b.dataset.feito; if(S.feitos[k])delete S.feitos[k];else S.feitos[k]=1; salvar();render();});});
  qa("[data-escolha]").forEach(function(s){s.addEventListener("change",function(){S.escolhas[s.dataset.escolha]=s.value;salvar();render();});});
  qa("[data-marca]").forEach(function(i){i.addEventListener("change",function(){S.marcas[i.dataset.marca]=i.value;salvar();});});
  qa("[data-abre]").forEach(function(b){b.addEventListener("click",function(){
    var k=b.dataset.abre; S.aberto[k]=!S.aberto[k]; salvar(); render();});});
  qa("[data-filtro]").forEach(function(b){b.addEventListener("click",function(){S.libFiltro=b.dataset.filtro;salvar();render();});});
}

carregar(render);
})();
</script>
